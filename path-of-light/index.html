// canvas ref for pointer lock, and the 3d graphics buffer

// LAYOUT + TOUCH SUPPORT
// The canvas fills the whole window (widescreen + phones). The 3D view and the
// in-game HUD use the real size. The menu screens were drawn for a 600x600
// canvas, so they're drawn in a centered 600x600 "UI space" that scales to fit.
// ==========================================================================
var UI_SIZE = 600;
var US = 1, UX = 0, UY = 0;   // UI space scale + offset (set every frame)
function computeUI() {
  US = constrain(min(width, height) / UI_SIZE, 0.5, 1.6);
  UX = (width  - UI_SIZE * US) / 2;
  UY = (height - UI_SIZE * US) / 2;
}
// real canvas pixels -> 600x600 UI space
function toUI(px, py) { return { x: (px - UX) / US, y: (py - UY) / US }; }

// phones/tablets: on-screen joystick + jump button, drag anywhere else to look
var IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
               (!window.matchMedia && 'ontouchstart' in window);
var touchMoveX = 0, touchMoveY = 0, touchJump = false;  // stick: -1..1, up = -y
var joyId = null, jumpId = null, lookId = null;
var lookLastX = 0, lookLastY = 0, joyKnobX = 0, joyKnobY = 0;
var touchLookSensitivity = 0.005;

function joyRadius()  { return constrain(min(width, height) * 0.16, 50, 80); }
function jumpRadius() { return constrain(min(width, height) * 0.11, 38, 56); }
// in portrait, lift the controls so mobile browser bars don't cover them
function bottomPad()  { return height > width ? Math.max(90, height * 0.12) : Math.max(40, height * 0.08); }
function sidePad()    { return width > height ? 24 : 0; }  // keep clear of notches/edge gestures
function joyCenter()  { var r = joyRadius();  return { x: r + 28 + sidePad(), y: height - r - 28 - bottomPad() }; }
function jumpCenter() { var r = jumpRadius(); return { x: width - r - 32 - sidePad(), y: height - r - 44 - bottomPad() }; }

function updateJoy(x, y) {
  var c = joyCenter(), r = joyRadius();
  var dx = x - c.x, dy = y - c.y, len = sqrt(dx * dx + dy * dy);
  if (len > r) { dx = dx / len * r; dy = dy / len * r; len = r; }
  joyKnobX = dx; joyKnobY = dy;
  if (len / r < 0.15) { touchMoveX = 0; touchMoveY = 0; }   // dead zone
  else { touchMoveX = dx / r; touchMoveY = dy / r; }
}

// tap on a menu button (title / how to play), in real canvas pixels
function menuTap(x, y) {
  var m = toUI(x, y);
  var inBox = function(bx, by, bw, bh) { return m.x >= bx && m.x <= bx + bw && m.y >= by && m.y <= by + bh; };
  if (scene === "title") {
    if (inBox(UI_SIZE / 2 - 175, UI_SIZE / 2 + 20, 150, 50)) { scene = "game"; loadLevel(currentLevel); }
    else if (inBox(UI_SIZE / 2 + 25, UI_SIZE / 2 + 20, 150, 50)) { scene = "howToPlay"; }
  } else if (scene === "howToPlay") {
    if (inBox(20, UI_SIZE - 60, 100, 40)) scene = "title";
  }
}

function onTouchStart(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i], x = t.clientX, y = t.clientY;
    if (scene === "title" || scene === "howToPlay") { menuTap(x, y); continue; }
    if (scene !== "game") continue;
    if (dead) { if (deathAnimationFrames > 120) resetDeath(); continue; }
    var jc = joyCenter(), kc = jumpCenter();
    if (joyId === null && dist(x, y, jc.x, jc.y) < joyRadius() * 1.4) {
      joyId = t.identifier; updateJoy(x, y);
    } else if (jumpId === null && dist(x, y, kc.x, kc.y) < jumpRadius() * 1.3) {
      jumpId = t.identifier; touchJump = true;
    } else if (lookId === null) {
      lookId = t.identifier; lookLastX = x; lookLastY = y;
    }
  }
  e.preventDefault();
}
function onTouchMove(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier === joyId) updateJoy(t.clientX, t.clientY);
    else if (t.identifier === lookId) {
      camAngleY -= (t.clientX - lookLastX) * touchLookSensitivity;
      camAngleX = constrain(camAngleX - (t.clientY - lookLastY) * touchLookSensitivity, radians(-89), radians(89));
      lookLastX = t.clientX; lookLastY = t.clientY;
    }
  }
  e.preventDefault();
}
function onTouchEnd(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var id = e.changedTouches[i].identifier;
    if (id === joyId)  { joyId = null; touchMoveX = 0; touchMoveY = 0; joyKnobX = 0; joyKnobY = 0; }
    if (id === jumpId) { jumpId = null; touchJump = false; }
    if (id === lookId) { lookId = null; }
  }
}

function drawTouchControls() {
  var jc = joyCenter(), jr = joyRadius(), kc = jumpCenter(), kr = jumpRadius();
  strokeWeight(2); stroke(255, 110); fill(255, 38);
  ellipse(jc.x, jc.y, jr * 2, jr * 2);
  noStroke(); fill(255, 150);
  ellipse(jc.x + joyKnobX, jc.y + joyKnobY, jr * 0.9, jr * 0.9);

  ellipse(kc.x, kc.y, kr * 2, kr * 2);
  noStroke(); fill(255, 220); textAlign(CENTER, CENTER); textSize(kr * 0.36);
  text("JUMP", kc.x, kc.y);
}

var drawSkull = function(x, y, s) {
  // a little ghost with a wavy hem (original design, replaces the old skull)
  noStroke();
  beginShape();
  // round head: left side up and over to the right side
  for (var a = PI; a <= TWO_PI + 0.001; a += PI / 24) {
    vertex(x + cos(a) * s * 0.55, y - s * 0.08 + sin(a) * s * 0.55);
  }

  vertex(x + s * 0.55, y + s * 0.62);

    vertex(x + s * 0.55 - t * s * 1.1, y + s * 0.62 + sin(t * TWO_PI * 2.5) * s * 0.07);

};

// smoothly lerp between two angles without flipping at 0/360
// this took me as long as the collisions ):
function lerpAngle(a, b, t) {
  var nA = (a % 360 + 360) % 360, nB = (b % 360 + 360) % 360;
  var d  = nB - nA;
  if (abs(d) > 180) { if (d > 0) nA += 360; else nB += 360; }
  return (nA + (nB - nA) * t) % 360;
}
 
 
// AABB collision. credit to chatGPT for explaining 3D collisions.
// consolidated from 2 functions into 1 because I am lazy
function checkCollision(ox, oy, oz, box) {
  var bMinX = box.position.x - box.size.width  / 2, bMaxX = box.position.x + box.size.width  / 2;
  var bMinZ = box.position.z - box.size.length / 2, bMaxZ = box.position.z + box.size.length / 2;
  var pMinX = ox - playerSize / 2, pMaxX = ox + playerSize / 2;
  var pMinZ = oz - playerSize / 2, pMaxZ = oz + playerSize / 2;
  var oH = pMaxX >= bMinX && pMinX <= bMaxX && pMaxZ >= bMinZ && pMinZ <= bMaxZ;
 
  var pTop = oy - playerSize / 2, pBot = oy + playerSize / 2;
  var bTop = box.position.y - box.size.height / 2, bBot = box.position.y + box.size.height / 2;
  var oV   = pTop < bBot && pBot > bTop;
 
  var vert = "none";
  if (oH) {
    if (jumpSpeed >= 0 && pBot >= bTop && pTop < bTop)     vert = "top";    // landed on top
    else if (jumpSpeed < 0 && pTop <= bBot && pBot > bBot) vert = "bottom"; // hit from below
  }
  return { horizontal: oH && oV, vertical: vert };
}
// keeping these wrappers so I don't have to change everything else
function checkHorizontalCollision(ox, oy, oz, box) { return checkCollision(ox, oy, oz, box).horizontal; }
function checkVerticalCollision(ox, oy, oz, box)   { return checkCollision(ox, oy, oz, box).vertical;   }
 
 
// make sure we don't spawn inside a wall. that wouldn't be fun right
function safeSpawn(x, y, z) {
  for (var i = 0; i < colliders.length; i++) {
    var b = colliders[i];
    if (x > b.x && x < b.x + b.w && z > b.z && z < b.z + b.d) y = b.h + 10;
  }
  return {x:x, y:y, z:z};
}

                 size:{width:60+Math.random()*80,height:20+Math.random()*30,length:60+Math.random()*80},
                 color:g.color(70+Math.random()*30) });
      }
      return c;
    })(),
    goal:       { position:{x:400,y:-350,z:350}, size:{width:40,height:40,length:40}, color:g.color(0,255,50) },
    background: 40
  });
 
 
  // Level 4: The Cliff - more climbing yay
  levels.push({
    colliders: (function() {
      var c = [], n = 12, last = {x:0,y:0,z:0};
      // starting platform
      c.push({ position:{x:0,y:0,z:0}, size:{width:100,height:10,length:100}, color:g.color(80) });
      for (var i = 0; i < n; i++) {
        var px = last.x+80+(Math.random()*40-20), pz = last.z+80+(Math.random()*40-20), py = -20-i*30;
        // every 3rd one is a super narrow pillar. rip
        if (i%3===0 && i>0) {
          c.push({ position:{x:px,y:py,z:pz}, size:{width:10,height:30,length:10}, color:g.color(50) });
        } else {
          c.push({ position:{x:px,y:py,z:pz}, size:{width:40+Math.random()*30,height:10,length:40+Math.random()*30}, color:g.color(50+Math.random()*40) });
        }
        last = {x:px,y:py,z:pz};
      }
      // big platform at the end
      c.push({ position:{x:last.x+200,y:last.y-50,z:last.z+200}, size:{width:250,height:10,length:250}, color:g.color(100) });
      return c;
    })(),
    goal:       { position:{x:1200,y:-450,z:1200}, size:{width:40,height:40,length:40}, color:g.color(0,255,50) },
    background: 60
  });
 
 
  // Level 5: The Tower - climb it really high
  // variables that helped make it actually playable
  var tPC = 15, tYS = 0, tYStep = -60, tR = 150, tAS = Math.PI/4.5, tX = 60;
  var finalPY = tYS + tPC * tYStep;
  levels.push({
    colliders: (function() {
      var c = [];
      // starting platform (offset so you don't spawn inside the tower lol)
      c.push({ position:{x:tX,y:0,z:0}, size:{width:150,height:10,length:150}, color:g.color(90) });
      // dark imposing core
      c.push({ position:{x:tX,y:finalPY/2,z:0}, size:{width:80,height:Math.abs(finalPY),length:80}, color:g.color(20,20,25) });
      // spiral platforms using trig (sin/cos wahhhh)
      for (var i = 1; i <= tPC; i++) {
        var ang = i*tAS, ps = 40+(i%4)*5;
        c.push({ position:{x:tX+tR*Math.cos(ang),y:tX+tYS+i*tYStep,z:tX+tR*Math.sin(ang)},
                 size:{width:ps,height:10,length:ps}, color:g.color(30+(i%3)*10) });
      }
      // landing platform at the top
      c.push({ position:{x:tX,y:finalPY,z:0}, size:{width:150,height:10,length:150}, color:g.color(120,100,50) });
      return c;
    })(),
    goal:       { position:{x:tX,y:finalPY,z:0}, size:{width:40,height:40,length:40}, color:g.color(13,255,0) },
    background: color(40,62,64)
  });
 
 
  // Level 6: 3,000 Feet and Climbing - hard jumps above void. no floor. good luck.
  levels.push((function() {
    var c = [], vPC = 20, vYStep = -25, last = {x:0,y:50,z:0};
    c.push({ position:{x:0,y:50,z:0}, size:{width:80,height:10,length:80}, color:g.color(100) });
    for (var i = 0; i < vPC; i++) {
      var dist = 128+Math.random()*50, ang = Math.random()*1.5*Math.PI;
      var px = last.x+dist*Math.cos(ang), pz = last.z+dist*Math.sin(ang), py = last.y+vYStep;
      var ps = 35+Math.random()*20; // 35x35 to 50x50
      c.push({ position:{x:px,y:py,z:pz}, size:{width:ps,height:10,length:ps}, color:g.color(100+Math.random()*40) });
      last = {x:px,y:py,z:pz};
    }
    return { colliders:c,
             goal:{ position:{x:last.x,y:last.y,z:last.z}, size:{width:40,height:40,length:40}, color:g.color(0,250,9) },
             background: color(40,81,100) }; // oooo more blue
  })());
 
 
  // Level 7: The First Life - trees appear (they're just green platforms but i call them bushes)
  levels.push((function() {
    var c = [], pSY = -40, n = 50, last = {x:0,y:100,z:0}; // originally 150 but that was way too much lol
    c.push({ position:{x:0,y:100,z:0}, size:{width:120,height:10,length:120}, color:g.color(50,80,50) });
    for (var i = 0; i < n; i++) {
      var y = last.y+pSY, dist = 70+Math.random()*60, ac = Math.PI/4+Math.random()*(Math.PI/2);
      var px = last.x+dist*Math.cos(ac*i), pz = last.z+dist*Math.sin(ac*i);
      c.push({ position:{x:px,y:y,z:pz}, size:{width:30,height:10,length:30}, color:g.color(60,100,60) }); // green cuz alive or something
      last = {x:px,y:y,z:pz};
    }
    return { colliders:c,
             goal:{ position:{x:last.x,y:last.y,z:last.z}, size:{width:40,height:40,length:40}, color:g.color(150,255,150) },
             background: color(40,100,140) };
  })());
 
 
  // Level 8: A Thing Called Color - vibrant colors, spiral pattern
  levels.push((function() {
    var c = [], n = 67, bR = 100, rGrow = 5, aStep = Math.PI/8, last = {x:0,y:0,z:0};
 
    // generate a random vibrant color (makes sure at least one channel is bright)
    function vibrant() {
      var r = Math.floor(Math.random()*255);
      var gv = Math.floor(Math.random()*255); // gv not g, don't shadow the graphics buffer lol
      var b = Math.floor(Math.random()*255);
      if (r<150 && gv<150 && b<150) {
        var ch = Math.floor(Math.random()*3);
        if (ch===0) r=255; else if (ch===1) gv=255; else b=255;
      }
      return color(r, gv, b);
    }
 
    c.push({ position:{x:0,y:0,z:0}, size:{width:100,height:10,length:100}, color:vibrant() });
    for (var i = 1; i <= n; i++) {
      var y = i*-25, rad = bR+i*rGrow, ang = i*aStep; // growing radius = spiral expand thing
      var px = rad*Math.cos(ang), pz = rad*Math.sin(ang), ps = 50+Math.random()*20;
      c.push({ position:{x:px,y:y,z:pz}, size:{width:ps,height:10,length:ps}, color:vibrant() });
      last = {x:px,y:y,z:pz};
    }
    return { colliders:c,
             goal:{ position:{x:last.x,y:last.y,z:last.z}, size:{width:40,height:40,length:40}, color:g.color(0,255,0) },
             background: color(10,150,200) };
  })());
 
 
  // Level 9: The Final Gate - open field, couple trees, last portal is gold this time O: O: O: :D :D :D
  levels.push((function() {
    var c = [];
    // big grassy field
    c.push({ position:{x:0,y:0,z:0},        size:{width:1500,height:40,length:1500},  color:g.color(50,70,40) });
    // tree 1 (trunk + leaves)
    c.push({ position:{x:-300,y:-200,z:200}, size:{width:40,height:360,length:40},     color:g.color(50,30,10) });
    c.push({ position:{x:-300,y:-325,z:200}, size:{width:150,height:150,length:150},   color:g.color(30,150,30) });
    // tree 2 (bigger)
    c.push({ position:{x:400,y:-280,z:-300}, size:{width:50,height:520,length:50},     color:g.color(40,20,0) });
    c.push({ position:{x:400,y:-600,z:-300}, size:{width:200,height:200,length:200},   color:g.color(40,180,40) });
    // bushes
    c.push({ position:{x:-200,y:-35,z:100},  size:{width:60,height:60,length:60},      color:g.color(20,100,20) });
    c.push({ position:{x:100,y:-45,z:-550},  size:{width:80,height:80,length:80},      color:g.color(30,120,30) });
    return { colliders:c,
             goal:{ position:{x:0,y:-150,z:-600}, size:{width:100,height:100,length:100}, color:g.color(255,220,0) }, // gold!
             background: color(0,119,255) };
  })());
}
 
 
// handle mouse movement. only fires if we actually have pointer lock
// credit to SupremeChicken for the pointer lock approach
var handleMove = function(e) {
  if (document.pointerLockElement !== cnv.elt) return;
  camAngleY -= e.movementX * mouseSensitivity;
  // angles stored in radians, clamped to just under 90 so we never flip
  camAngleX = constrain(camAngleX - e.movementY * mouseSensitivity, radians(-89), radians(89));
};
 
// reset everything after dying
function resetDeath() {
  skullSize = 20000; skullTrans = 0; shakeIntensity = 25;
  deathAnimationFrames = 0; gameOverTextTransparency = 1;
  innerCircleSize = 1; dead = false;
  loadLevel(currentLevel);
  selectRandomDeathMessage();
}
 
 
function setup() {
  // sharper on small screens, but keep big windows fast
  pixelDensity(windowWidth * windowHeight * 4 <= 3000000 ? 2 : 1);
  cnv = createCanvas(windowWidth, windowHeight);   // fills the window
  smooth(); // native AA, replaces the FXAA shader
 
  // off-screen WEBGL buffer for all the 3d stuff
  g = createGraphics(windowWidth, windowHeight, WEBGL);
  g.smooth();
 
  // one mousemove listener, handler checks lock state itself
  document.addEventListener('mousemove', handleMove);
 
  // touch devices: joystick / jump / drag-to-look
  if (IS_TOUCH) {
    document.addEventListener('touchstart',  onTouchStart,  { passive: false });
    document.addEventListener('touchmove',   onTouchMove,   { passive: false });
    document.addEventListener('touchend',    onTouchEnd);
    document.addEventListener('touchcancel', onTouchEnd);
  }
 
  selectRandomDeathMessage();
  buildLevels();
  loadLevel(currentLevel);
}
 
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  g.resizeCanvas(windowWidth, windowHeight);
}
 
function draw() {
  computeUI();
  dt = constrain(deltaTime / (1000 / 60), 0, 6);   // cap so a hidden tab doesn't jump
  // print save code to console (copy paste it to the saveCode variable at the top)
  if (keys[ENTER]) {
    console.log("var saveCode = [0, " + (currentLevel * 3) + ", " + (TIME * Math.PI).toFixed(2) + ", 5];");
  }
 
  // non-game scenes
  if (scene === "title")     { push(); drawTitleScreen();     pop(); return; }
  if (scene === "howToPlay") { push(); drawHowToPlayScreen(); pop(); return; }
  if (scene === "won") {
    // lame win screen lol
    background(0); fill(255); textAlign(CENTER, CENTER);
    translate(UX, UY); scale(US);
    textSize(100); text("YOU WON!", 300, 250);
    textSize(30); fill(166, 0, 255);
    text("TIME: " + formatNumber(round(TIME / 60)) + " sec", 300, 350);
    text("Not many players win - congrats!", 300, 400);
    noLoop(); return;
  }
 
  TIME += dt;
 
  // clear the 3d buffer with the level's background color
  if (levels[currentLevel] && levels[currentLevel].background) {
    g.background(levels[currentLevel].background);
  } else {
    g.background(0); // fallback
  }
  g.lights(); // has to be called every frame in p5.js webgl, annoying
 
  if (showOutlines) { g.strokeWeight(1); g.stroke(1); }
  else              { g.noStroke(); }
 
  // The physics runs in sub-steps of at most one 60fps frame, so a slow frame
  // (low fps) can't make the player skip through a wall or floor.
  var steps = max(1, ceil(dt));
  var sdt = dt / steps;
  for (var step = 0; step < steps; step++) {
    // save position before moving so we can roll back on collision
    prevPlayerX = playerX; prevPlayerY = playerY; prevPlayerZ = playerZ;
 
    // --- player movement ---
    var fDX = sin(camAngleY), fDZ = cos(camAngleY); // forward direction
    var hasInput = false, targetRotY = playerRotationY;
    var desVX = 0, desVZ = 0;
 
    if (keys[87]) { desVX -= fDX; desVZ -= fDZ; hasInput = true; } // W
    if (keys[83]) { desVX += fDX; desVZ += fDZ; hasInput = true; } // S
    if (keys[65]) { desVX -= fDZ; desVZ += fDX; hasInput = true; } // A
    if (keys[68]) { desVX += fDZ; desVZ -= fDX; hasInput = true; } // D
    // touch joystick (up = forward, same directions as W/A/S/D)
    if (touchMoveX !== 0 || touchMoveY !== 0) {
      desVX += fDX * touchMoveY + fDZ * touchMoveX;
      desVZ += fDZ * touchMoveY - fDX * touchMoveX;
      hasInput = true;
    }
 
    // get target rotation from the movement vector directly
    // atan2 handles all diagonal combos (W+A etc) perfectly
    if (hasInput) targetRotY = degrees(atan2(-desVX, -desVZ));
 
    // normalize and apply acceleration
    var mag = sqrt(desVX * desVX + desVZ * desVZ);
    if (mag > 0) {
      desVX /= mag; desVZ /= mag;
      playerVelocityX += desVX * acceleration * sdt;
      playerVelocityZ += desVZ * acceleration * sdt;
    } else {
      // no input, apply friction
      var fr = pow(friction, sdt);
      playerVelocityX *= fr; playerVelocityZ *= fr;
      if (abs(playerVelocityX) < 0.1) playerVelocityX = 0;
      if (abs(playerVelocityZ) < 0.1) playerVelocityZ = 0;
    }
 
    // cap speed
    var spd = sqrt(playerVelocityX*playerVelocityX + playerVelocityZ*playerVelocityZ);
    if (spd > maxSpeed) {
      playerVelocityX = playerVelocityX / spd * maxSpeed;
      playerVelocityZ = playerVelocityZ / spd * maxSpeed;
    }
 
    // --- horizontal collisions ---
    // check X and Z separately so you don't get caught on corners
    playerX += playerVelocityX * sdt;
    for (var i = 0; i < colliders.length; i++) {
      if (checkHorizontalCollision(playerX, prevPlayerY, prevPlayerZ, colliders[i])) {
        playerX = prevPlayerX; playerVelocityX = 0; // undo
      }
    }
    playerZ += playerVelocityZ * sdt;
    for (var i = 0; i < colliders.length; i++) {
      if (checkHorizontalCollision(prevPlayerX, prevPlayerY, playerZ, colliders[i])) {
        playerZ = prevPlayerZ; playerVelocityZ = 0; // undo
      }
    }
 
    // smoothly rotate the player towards where they're moving
    if (hasInput) playerRotationY = lerpAngle(playerRotationY, targetRotY, 1 - pow(0.9, sdt));
 
    // gravity
    if (!onGround) { playerY += jumpSpeed * sdt; jumpSpeed += gravity * sdt; }
 
    // --- vertical collisions ---
    var onSurface = false;
    for (var i = 0; i < colliders.length; i++) {
      var vr = checkVerticalCollision(playerX, playerY, playerZ, colliders[i]);
      if (vr === "top") {
        // landed on top of a box
        playerY = colliders[i].position.y - colliders[i].size.height / 2 - playerSize / 2;
        isJumping = false; onGround = true; jumpSpeed = 0; onSurface = true;
      } else if (vr === "bottom") {
        // hit a box from below
        playerY = colliders[i].position.y + colliders[i].size.height / 2 + playerSize / 2;
        jumpSpeed = 0;
      }
    }
    onGround = onSurface;
 
    if ((keys[32] || touchJump) && onGround) { isJumping = true; onGround = false; jumpSpeed = -8; } // jump
    if (playerY > fallResetY)  dead = true; // fell into the void
 
    // did we reach the goal?
    if (goal && checkHorizontalCollision(playerX, playerY, playerZ, goal)) {
      txtFade = 0;
      if (currentLevel < levels.length - 1) loadLevel(currentLevel + 1);
      else scene = "won";
    }
 
  }
 
  // --- camera ---
  var ctY = playerY + camYOffset;
  var cX  = playerX + camDist * sin(camAngleY) * cos(camAngleX);
  var cZ  = playerZ + camDist * cos(camAngleY) * cos(camAngleX);
  var cY  = ctY     + camDist * sin(camAngleX);
  // same vertical field of view as the old 600x600 view, so a wider window shows more to the sides
  // on tall (portrait) screens the sides get cramped, so widen the vertical fov a bit
  var fovHalf = 300 / 800;
  if (width < height) fovHalf *= 1 + Math.min(0.5, (height / width - 1) * 0.45);
  g.perspective(2 * Math.atan(fovHalf), width / height, 80, 8000);
  g.camera(cX, cY, cZ, playerX, playerY, playerZ, 0, 1, 0);
 
  // --- draw the world ---
  // we gotta put g. before anything 3d. trust me it's annoying.
  // and python ppl think semicolons are bad
  for (var i = 0; i < colliders.length; i++) {
    var col = colliders[i];
    g.fill(col.color);
    g.push();
    g.translate(col.position.x, col.position.y, col.position.z);
    if (col.size.height === 1) {
      g.rotateX(radians(90));
      g.box(col.size.width, col.size.length, col.size.height);
    } else {
      g.box(col.size.width, col.size.height, col.size.length);
    }
    g.pop();
  }
 
  // draw the goal box
  if (goal) {
    g.fill(goal.color);
    g.push();
    g.translate(goal.position.x, goal.position.y, goal.position.z);
    g.box(goal.size.width, goal.size.height, goal.size.length);
    g.pop();
  }
 
  // draw the player (blue cube with face)
  g.push();
  g.translate(playerX, playerY, playerZ);
  g.rotateY(radians(playerRotationY));
  g.fill(0, 60, 255);
  g.box(playerSize, playerSize, playerSize);
  g.translate(0, 0, -playerSize / 2 - 0.1);
  drawFace(0, 0, playerSize / 4);
  g.pop();
 
  // blit the 3d buffer to the main canvas
  image(g, 0, 0);
 
  // --- 2D HUD ---
  txtFade += 2 * dt;
  var poem = levelPoems[currentLevel].substring(0, currentDigitPosition);
 
  noStroke(); fill(0, 0, 0, 100);
  rect(width / 2 - 176, -100, 353, 200, 10);
  fill(255, 255, 255, txtFade);
  textAlign(CENTER, BASELINE);
  textSize(22); text(levelNames[currentLevel], width / 2, 33);
  textSize(15); text(poem, width / 2, 54);
 
  // type out the poem character by character
  if (currentDigitPosition < levelPoems[currentLevel].length && txtFade > 255) {
    digitTimer += dt;
    if (digitTimer >= 3) { digitTimer -= 3; currentDigitPosition++; }
  }
 
  if (IS_TOUCH && !dead) drawTouchControls();

  // --- death screen ---
  if (dead) {
    push(); translate(UX, UY); scale(US);   // drawn in 600x600 UI space
    // shake effect
    if (deathAnimationFrames > 20 && deathAnimationFrames < 100) {
      if (shakeIntensity > 1) {
        shakeX = random(-shakeIntensity, shakeIntensity);
        shakeY = random(-shakeIntensity, shakeIntensity);
      }
      shakeIntensity -= 0.6 * dt;
    }
    noStroke();
    fill(0, innerCircleSize * 2);
    ellipse(300, 300, innerCircleSize - 1, innerCircleSize - 1);
    innerCircleSize = deathAnimationFrames * 30;
 
    fill(255, 255, 255, skullTrans);
    drawSkull(300 + shakeX, 300 + shakeY, skullSize * 1.5);
    fill(0, 0, 0, skullTrans * 2);
    drawEye(300 + shakeX, 300 + shakeY, skullSize * 1.5);
 
    fill(0, 255, 191, gameOverTextTransparency);
    textSize(80); textAlign(CENTER, CENTER);
    text("You Died", 300, 280);
    textSize(25);
    fill(41, 230, 224, gameOverTextTransparency - 255);
    text(currentDeathMessage, 300, 340);
    fill(214, 7, 7, gameOverTextTransparency - 500);
    textSize(45);
    text("- Click to Continue -", 300, 400);
 
    if (deathAnimationFrames < 100 && skullTrans < 255) skullTrans += 10 * dt;
    if (deathAnimationFrames < 100 && skullSize  > 200) skullSize  /= pow(1.3, dt);
 
    if (deathAnimationFrames > 120) {
      skullSize  += 10 * dt; skullTrans -= 10 * dt; gameOverTextTransparency += 5 * dt;
      if (mouseIsPressed) resetDeath();
    }
    deathAnimationFrames += dt;
    pop();
  }
}
 
// not too long honestly, most the code is levels + comments anyway
 
// return false so the browser doesn't scroll on space/arrow keys
function keyPressed()  { keys[keyCode] = true;  return false; }
function keyReleased() { keys[keyCode] = false; }
 
function mousePressed() {
  // lock the mouse when clicking into the game
  // (made it auto-lock so you don't have to think about it, thank me later)
  if (scene === "game" && !IS_TOUCH) cnv.elt.requestPointerLock();
  if (dead && deathAnimationFrames > 120) resetDeath();
}
 
function mouseClicked() {
  if (scene === "title" && titleButtonCanClick) {
    scene = sceneToGo;
    if (sceneToGo === "game") {
      if (!IS_TOUCH) cnv.elt.requestPointerLock();
      loadLevel(currentLevel);
    }
  } else if (scene === "howToPlay") {
    var m = toUI(mouseX, mouseY);
    if (m.x > 20 && m.x < 120 && m.y > UI_SIZE - 60 && m.y < UI_SIZE - 20) {
      scene = "title";
    }
  }
}
