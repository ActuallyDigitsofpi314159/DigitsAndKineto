<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Digits & Kineto — an indie dev studio. Play our games and try DK Converter.">
    <meta name="theme-color" content="#06070d">
    <title>Digits &amp; Kineto</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="stylesheet" href="assets/home.css">
</head>
<body>
    <header data-site-header data-site-root="" data-current="home"></header>

    <main class="page">
        <section class="hero">
            <img src="assets/img/studio-banner.jpg" alt="Digits &amp; Kineto — an indie dev studio" width="1672" height="740">
            <div class="hero-wordmark" aria-hidden="true">
                <span class="digits">Digits<span class="amp">&amp;</span></span>
                <span class="kineto">Kineto</span>
            </div>
        </section>

        <h1 class="outline-title" aria-label="Games">
            <svg class="lines left" viewBox="0 0 160 100" aria-hidden="true">
                <path d="M70 18 H156 L144 42 H58 Z"/>
                <path d="M22 56 H150 L138 80 H10 Z"/>
            </svg>
            <span class="word" aria-hidden="true">GAMES</span>
            <svg class="lines right" viewBox="0 0 160 100" aria-hidden="true">
                <path d="M16 18 H152 L140 42 H4 Z"/>
                <path d="M16 56 H100 L88 80 H4 Z"/>
            </svg>
        </h1>

        <section class="featured is-loading" id="featured" aria-label="Featured game"></section>

        <div class="search-row">
            <h2>All games</h2>
            <label class="search">
                <span class="sr-only">Search games</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
                <input type="search" id="game-search" placeholder="Search..." autocomplete="off">
            </label>
        </div>

        <section class="game-grid" id="game-grid" aria-label="All games" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
        <span class="studio-mark">DK Studios</span>
        <span>Contact us at <a href="mailto:actuallydigitsofpi314159@gmail.com">actuallydigitsofpi314159@gmail.com</a></span>
    </footer>

    <script src="assets/site.js"></script>
    <script src="games/games.js"></script>
    <script src="assets/game-registry.js"></script>
    <script src="assets/home.js"></script>
</body>
</html>
