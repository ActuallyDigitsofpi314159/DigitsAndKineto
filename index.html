<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Digits and Kineto projects, tools, and games.">
    <title>Digits and Kineto</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #080b12;
            color: #eef3fb;
        }
        * { box-sizing: border-box; }
        @view-transition {
            navigation: auto;
        }
        ::view-transition-old(root) {
            animation: 220ms ease-in both page-transition-out;
        }
        ::view-transition-new(root) {
            animation: 280ms ease-out both page-transition-in;
        }
        @keyframes page-transition-out {
            to { opacity: 0; transform: translateY(-8px); }
        }
        @keyframes page-transition-in {
            from { opacity: 0; transform: translateY(8px); }
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(63, 255, 125, .12), transparent 36rem),
                radial-gradient(ellipse at 85% 80%, rgba(85, 182, 255, .13), transparent 40rem),
                #080b12;
        }
        main {
            width: min(100%, 760px);
            padding: clamp(2rem, 7vw, 4.5rem);
            border: 1px solid rgba(125, 160, 190, .24);
            border-radius: 24px;
            background: rgba(15, 20, 30, .88);
            box-shadow: 0 24px 90px rgba(0, 0, 0, .42);
        }
        .eyebrow {
            margin: 0 0 1rem;
            color: #75e8a0;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.8rem);
            line-height: 1.05;
            letter-spacing: -.06em;
        }
        .intro {
            max-width: 38rem;
            margin: 1.5rem 0 2.25rem;
            color: #aeb9c8;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        .project {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 1.4rem;
            border: 1px solid rgba(85, 182, 255, .28);
            border-radius: 16px;
            background: rgba(85, 182, 255, .06);
        }
        .project h2 { margin: 0 0 .35rem; font-size: 1.2rem; }
        .project p { margin: 0; color: #aeb9c8; line-height: 1.5; }
        a {
            flex: 0 0 auto;
            padding: .8rem 1.1rem;
            border-radius: 10px;
            background: linear-gradient(100deg, #3fff7d, #55b6ff);
            color: #07111a;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { filter: brightness(1.08); }
        footer { margin-top: 2.5rem; color: #788596; font-size: .9rem; }
        @media (prefers-reduced-motion: reduce) {
            ::view-transition-old(root),
            ::view-transition-new(root) {
                animation: none;
            }
        }
        @media (max-width: 560px) {
            .project { align-items: flex-start; flex-direction: column; }
            a { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">A small project studio</p>
        <h1>Digits<br>&amp; Kineto</h1>
        <p class="intro">A home for the tools, experiments, and games we make. More projects will be added here over time.</p>
        <section class="project" aria-labelledby="converter-title">
            <div>
                <h2 id="converter-title">DK Converter</h2>
                <p>Convert images, GIFs, videos, and audio into Khan Academy code.</p>
            </div>
            <a href="/dkconverter/">Open converter</a>
        </section>
        <footer>More projects coming soon.</footer>
    </main>
</body>
</html>
