  Maze Man 2 — v1.1 (standalone HTML export)

  Leaderboard [ 🥇: Digits - 15 ]

  Credits [
   * SupremeChicken - pointerlock (original KA version)
   * chatGPT - logic & commenting code

   * Daniel - loop prot.
   * RadioDemon - their raycasted maze showed me how to use textured walls
   * v1.1: Larry's face and the death skull are brand-new original drawings (code-drawn)
  ]

  Lore [
   You work for a genetic research facility, and they decided to use you as their test subject.
   LARRY, a ruthless guard, has been designed to make sure nobody passes through.
   Travel endless mazes in hope of escaping alive.  (jk Larry is hungry 😼)
  ]

  About Larry [
   Larry uses A* to get around, but he moves off-grid between the waypoints. He patrols to random
   points; if he sees you (raycast line of sight) he charges straight at you; if he loses you he goes
   to the last spot he saw you, then goes back to patrolling.
  ]

  v1.1 changes [
   * Rewritten from Processing.js to plain JavaScript + canvas so it runs anywhere as one file
   * New level-complete warp animation, new death sequence, new How to Play screen
   * Larry has an original face and is now a real 3D sprite (off-grid, glowing eyes)
   * Camera-pan "wake up" transition from the title into the game
   * Delta time (same speed at 30/60/144 Hz), widescreen + mobile touch controls
   * Faster renderer (pixel buffer, adaptive resolution), faster A*, fixed rare maze-gen crash
  ]

(function () {

/* =====================================================================
   SMALL HELPERS

var TAU = Math.PI * 2, D2R = Math.PI / 180;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function easeOutCubic(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) { t = clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeInOutSine(t) { t = clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function dist(x0, y0, x1, y1) { var dx = x1 - x0, dy = y1 - y0; return Math.sqrt(dx * dx + dy * dy); }
// keyframes: [[t, v], ...] smoothly interpolated
function keyframes(kf, t) {
  if (t <= kf[0][0]) return kf[0][1];
  for (var i = 1; i < kf.length; i++) {
    if (t <= kf[i][0]) {
      var a = kf[i - 1], b = kf[i];
      return lerp(a[1], b[1], sstep(a[0], b[0], t));
    }
  }
  return kf[kf.length - 1][1];
}
function makeCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
var FONT = '"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif';

/* =====================================================================
   CANVAS, SCREEN SIZE, RENDER BUFFER
   Everything 3D is drawn into a small pixel buffer (fast), then scaled up.
   Menus are drawn in a 600x600 "design box" (same coordinates as the KA
   canvas) that is scaled and centered to fit any screen.
   ===================================================================== */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var W = 600, H = 600, DPR = 1;           // screen size in CSS pixels
var U = 1, UX = 0, UY = 0;               // design-box scale & offset
var isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || false;

var buf = makeCanvas(2, 2), bctx = buf.getContext('2d');
var RW = 2, RH = 2, img = null, u32 = null, zbuf = null;
var quality = isTouch ? 0.5 : 0.7;       // render height as a fraction of screen height
var QMIN = 0.3, QMAX = isTouch ? 0.6 : 0.85;

function setupBuffer() {
  RH = Math.round(clamp(H * quality, 180, 560));
  RW = Math.round(clamp(RH * W / H, 120, 1100));
  buf.width = RW; buf.height = RH;
  img = bctx.createImageData(RW, RH);
  u32 = new Uint32Array(img.data.buffer);
  zbuf = new Float32Array(RW);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  U = Math.min(W, H) / 600; UX = (W - 600 * U) / 2; UY = (H - 600 * U) / 2;
  setupBuffer();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
resize();
function scr() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }            // screen coords
function ui() { ctx.setTransform(DPR * U, 0, 0, DPR * U, DPR * UX, DPR * UY); } // 600-box coords
function toUI(px, py) { return { x: (px - UX) / U, y: (py - UY) / U }; }

/* =====================================================================

var AD = (function () {
  var c = null, drawOn = true;
  function arc(x, y, w, h, a0, a1) {

          u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1]];
}

function loadLevel(lv) {

function updateGame(dt) {

    if (keys.KeyD) str += 1;
    if (keys.ArrowLeft) turn -= 1;
    if (keys.ArrowRight) turn += 1;

  } else world.larrys.forEach(function (L) { L.anim += dt; });
  game.danger += ((near < 7 ? 1 - near / 7 : 0) - game.danger) * (1 - Math.exp(-dt * 5));
  if (caught) { startDeath(); return; }

}

  btnRetry.update(dt); btnMenuD.update(dt);
  scr();
  if (t < 1.6) {
    // ---- jumpscare ----
    var flick = Math.random() * 50;
    ctx.fillStyle = 'rgb(' + Math.round(flick * 1.3) + ',' + Math.round(flick * 0.5) + ',' + Math.round(flick * 0.5) + ')'; ctx.fillRect(0, 0, W, H);
    var sh = 30 * (1 - t / 1.6 * 0.6);
    var lunge = 0.7 + 0.4 * easeOutBack(t / 0.22) + (t > 1.25 ? Math.pow((t - 1.25) / 0.35, 2) * 2.5 : 0);
    var R = Math.min(W, H) * 0.42 * lunge;
    drawLarry(ctx, W / 2 + rnd(-sh, sh), H / 2 + rnd(-sh, sh) + R * 0.05, R, { mouth: clamp(t / 0.2, 0, 1) * (0.85 + 0.15 * Math.sin(t * 40)), lookX: rnd(-0.3, 0.3), lookY: rnd(-0.2, 0.2) });
    // glitch slices
    if (Math.random() < 0.6) {
      for (var i = 0; i < 4; i++) {
        var sy = Math.random() * H, sh2 = rnd(8, 40), off = rnd(-40, 40);
        ctx.drawImage(cv, 0, sy * DPR, cv.width, sh2 * DPR, off, sy, W, sh2);
      }

    ctx.fillStyle = 'rgba(255,0,0,' + (Math.random() < 0.25 ? 0.25 : 0) + ')'; ctx.fillRect(0, 0, W, H);
    drawWhite(sstep(1.3, 1.6, t), '#000');
    return;
  }
  // ---- skull + results ----
  var ts = t - 1.6;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  var drop = easeOutCubic(ts / 0.45), impact = ts > 0.45 ? Math.max(0, 1 - (ts - 0.45) / 0.8) : 0;
  if (ts > 0.45 && !death.dust.length) {

  }

  ctx.fillStyle = gl; ctx.fillRect(-600, -600, 1800, 1800);
  ctx.save(); ctx.globalAlpha = clamp(drop * 1.5, 0, 1);
  var chatter = ts > 0.45 && ts < 1.3 ? Math.abs(Math.sin(ts * 22)) * (1 - (ts - 0.45) / 0.85) : 0;
  drawSkull(ctx, 300 + shx, skY + shy, skS, { jaw: chatter * 0.9, crack: sstep(0.45, 0.8, ts), glow: 0.6 + 0.4 * Math.sin(T * 5) });
  ctx.restore();
  // dust
  death.dust.forEach(function (p) {
    p.l -= dt; p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.l > 0) { ctx.fillStyle = 'rgba(220,210,190,' + clamp(p.l, 0, 1) * 0.7 + ')'; ctx.fillRect(p.x, p.y, 3, 3); }
  });
  // YOU DIED
  if (ts > 1.1) {
    ctx.shadowColor = 'rgba(0,255,191,0.8)'; ctx.shadowBlur = 18; ctx.strokeStyle = 'rgb(0,255,191)';
    AD.text(ctx, 'You Died', 300, 330, 48, 'CENTER', { letter: function (i) {
      var lt = (ts - 1.15 - i * 0.07) / 0.4; return { a: clamp(lt * 2.5, 0, 1), dy: (1 - easeOutBack(lt)) * -50, r: (1 - clamp(lt, 0, 1)) * 0.4 * (i % 2 ? 1 : -1) };
    } });
    ctx.shadowBlur = 0;
  }
  var ra = sstep(1.8, 2.2, ts);
  ctx.globalAlpha = ra;
  txt('You reached level ' + death.reached, 300, 398, 20, 'rgb(41,230,224)', 'center', 'bold');
  if (death.newBest) txt('NEW BEST!', 300, 427, 15, 'rgba(255,215,60,' + (0.6 + 0.4 * Math.sin(T * 6)) + ')', 'center', 'bold');
  else txt('Best: level ' + best, 300, 427, 14, 'rgba(200,200,200,0.7)');
  ctx.globalAlpha = 1;
  var ba = sstep(2.2, 2.6, ts);
  btnRetry.alpha = btnMenuD.alpha = ba;
  btnRetry.draw((1 - ba) * 20); btnMenuD.draw((1 - ba) * 20);
  if (ts > 2.1 && !death.unlocked) { death.unlocked = true; releaseLock(); }
}

/* ---------------------------- HOW TO PLAY --------------------------- */
var howto = {
  page: 0, pos: 0, dragX: 0, n: 4,
  btnBack: new Button('Back', 56, 64, 74, 30, { secondary: true, size: 14 }),
  btnPrev: new Button('‹', 54, 270, 40, 60, { secondary: true, size: 30 }),
  btnNext: new Button('›', 506, 270, 40, 60, { secondary: true, size: 30 }),
  btnPlay: new Button('Play', 200, 440, 200, 50),
  go: function (d) { this.page = clamp(this.page + d, 0, this.n - 1); },
  dragTo: function (dx) { this.dragX = dx; },
  release: function (dx) { if (Math.abs(dx) > 60 && drag.moved) this.go(dx < 0 ? 1 : -1); this.dragX = 0; }
};
function updateHowto(dt) {
  titleLarryAnim(dt);
  var target = howto.page - howto.dragX / (480 * U);
  howto.pos += (target - howto.pos) * (1 - Math.exp(-dt * (howto.dragX ? 30 : 10)));
  [howto.btnBack, howto.btnPrev, howto.btnNext, howto.btnPlay].forEach(function (b) { b.update(dt); });
  howto.btnPrev.alpha = howto.page > 0 ? 1 : 0.0;
  howto.btnNext.alpha = howto.page < howto.n - 1 ? 1 : 0.0;
}
function keycap(x, y, label, on, w) {
  w = w || 46;
  var push = on ? 3 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; rrect(ctx, x - w / 2, y - 20 + 5, w, 44, 8); ctx.fill();
  ctx.fillStyle = on ? '#d8202e' : '#24161c'; rrect(ctx, x - w / 2, y - 22 + push, w, 42, 8); ctx.fill();
  ctx.strokeStyle = on ? '#ff8080' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, x, y - 1 + push, 18, '#fff', 'center', 'bold');
}
function bullet(x, y, color, text, w) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
  return wrapText(text, x + 16, y, w, 15, 'rgba(235,235,240,0.92)');
}
function wrapText(s, x, y, w, size, color) {
  ctx.font = size + 'px ' + FONT; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var words = s.split(' '), line = '', yy = y;
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > w && line) { ctx.fillText(line, x, yy); line = words[i]; yy += size * 1.35; }
    else line = test;
  }
  ctx.fillText(line, x, yy);
  return yy;
}
function heading(s, y, col) {
  ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.strokeStyle = col;
  AD.text(ctx, s, 300, y + 14, 25, 'CENTER'); ctx.shadowBlur = 0;
}
function howPage(i) {
  if (i === 0) {
    heading('Controls', 150, '#ff5a5a');
    if (!isTouch) {
      keycap(190, 222, 'W', keys.KeyW); keycap(140, 272, 'A', keys.KeyA); keycap(190, 272, 'S', keys.KeyS); keycap(240, 272, 'D', keys.KeyD);
      txt('Move', 190, 318, 15, 'rgba(255,200,200,0.9)', 'center', 'bold');
      // mouse

      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(352, 250); ctx.lineTo(340, 250); ctx.moveTo(468, 250); ctx.lineTo(480, 250); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(334, 250); ctx.lineTo(344, 243); ctx.lineTo(344, 257); ctx.fill();
      ctx.beginPath(); ctx.moveTo(486, 250); ctx.lineTo(476, 243); ctx.lineTo(476, 257); ctx.fill();
      ctx.fillStyle = '#24161c'; rrect(ctx, mx - 24, 214, 48, 74, 24); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx, 214); ctx.lineTo(mx, 242); ctx.stroke();
      txt('Look', 410, 318, 15, 'rgba(255,200,200,0.9)', 'center', 'bold');
      txt('Click the game to lock your mouse  ·  Esc to pause', 300, 368, 14, 'rgba(230,230,235,0.85)');
      txt('Arrow keys work too (← → to turn)', 300, 394, 13, 'rgba(200,200,210,0.6)');
    } else {
      var jx = 190 + Math.cos(T * 2) * 22, jy = 260 + Math.sin(T * 2) * 22;
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(190, 260, 46, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,80,80,0.7)'; ctx.beginPath(); ctx.arc(jx, jy, 20, 0, TAU); ctx.fill();
      txt('Left thumb: move', 190, 334, 15, 'rgba(255,200,200,0.9)', 'center', 'bold');
      var fx2 = 410 + Math.sin(T * 2) * 34;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(fx2 - Math.cos(T * 2) * 30, 260); ctx.lineTo(fx2, 260); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(fx2, 260, 16, 0, TAU); ctx.fill();
      txt('Right thumb: look', 410, 334, 15, 'rgba(255,200,200,0.9)', 'center', 'bold');
      txt('Tap the pause button (top-right) to pause', 300, 384, 14, 'rgba(230,230,235,0.85)');
    }
  } else if (i === 1) {
    heading('Meet Larry', 150, '#ff5a5a');
    var u = toUI(pointer.x, pointer.y), lx = clamp((u.x - 170) / 200, -1, 1), ly = clamp((u.y - 290) / 200, -1, 1);
    if (isTouch) { lx = Math.sin(T * 0.9); ly = Math.cos(T * 1.3) * 0.5; }
    ctx.save(); ctx.shadowColor = 'rgba(255,0,0,0.5)'; ctx.shadowBlur = 30;
    drawLarry(ctx, 170, 292 + Math.sin(T * 2) * 4, 82, { mouth: 0.15 + 0.15 * Math.sin(T * 1.7) + (Math.sin(T * 0.8) > 0.9 ? 0.6 : 0), lookX: lx, lookY: ly });
    ctx.restore();
    var y = 222;
    y = bullet(282, y, '#ff6a6a', 'He patrols the maze, wandering to random spots.', 196) + 30;
    y = bullet(282, y, '#ff6a6a', 'If he sees you, he charges straight at you.', 196) + 30;
    y = bullet(282, y, '#ff6a6a', 'Break line of sight and he hunts the spot he last saw you.', 196) + 30;
    bullet(282, y, '#ff6a6a', 'If he touches you... bad things happen.', 196);
  } else if (i === 2) {
    heading('Escape', 150, '#5aff8c');
    ctx.save(); ctx.translate(170, 292);
    ctx.shadowColor = 'rgba(60,255,120,0.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(0, 0, 74, 0, TAU); ctx.fillStyle = '#031'; ctx.fill(); ctx.shadowBlur = 0;
    ctx.clip(); ctx.rotate(T * 1.3); var s2 = 190 * (1 + 0.05 * Math.sin(T * 2.4)); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(portalCanvas, -s2 / 2, -s2 / 2, s2, s2); ctx.imageSmoothingEnabled = true;
    ctx.restore();
    ctx.strokeStyle = 'rgba(120,255,160,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(170, 292, 76, 0, TAU); ctx.stroke();
    var y2 = 222;
    y2 = bullet(282, y2, '#5aff8c', 'Find the green portal to escape the maze.', 196) + 30;
    y2 = bullet(282, y2, '#5aff8c', 'Every maze is bigger than the last.', 196) + 30;
    y2 = bullet(282, y2, '#5aff8c', 'Every 10 levels, another Larry joins the hunt.', 196) + 30;
    bullet(282, y2, '#5aff8c', "It never ends. How far can you get?", 196);
  } else {
    heading('Ready?', 150, '#ff5a5a');
    txt('Your best', 300, 222, 14, 'rgba(255,200,200,0.75)', 'center', 'bold');
    txt(best > 0 ? 'Level ' + best : '—', 300, 256, 34, '#fff', 'center', 'bold');
    txt('Leaderboard #1:  Digits — 15', 300, 306, 15, 'rgba(255,215,60,0.9)', 'center', 'bold');
    txt('Try to get on the leaderboard!', 300, 332, 14, 'rgba(230,230,235,0.8)');
    txt('Warning: flashing lights and jumpscares.', 300, 380, 13, 'rgba(200,200,200,0.6)');
  }
}
function drawHowto() {
  present(titleWorld, titleView(), [titleLarry], freshFx());
  drawVignette(0.6);
  var a = easeOutCubic(st / 0.4);
  scr(); ctx.fillStyle = 'rgba(0,0,0,' + 0.55 * a + ')'; ctx.fillRect(0, 0, W, H);
  ui(); ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 40);
  ctx.shadowColor = 'rgba(255,0,0,0.35)'; ctx.shadowBlur = 30;
  rrect(ctx, 40, 50, 520, 500, 20); ctx.fillStyle = 'rgba(14,8,14,0.92)'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,80,80,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowColor = 'rgba(255,0,0,0.8)'; ctx.shadowBlur = 14; ctx.strokeStyle = '#ff4646';
  AD.text(ctx, 'How to Play', 300, 90, 15, 'CENTER'); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,80,80,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(60, 114); ctx.lineTo(540, 114); ctx.stroke();
  // pages (slide + fade)
  ctx.save(); ctx.beginPath(); ctx.rect(44, 116, 512, 380); ctx.clip();
  for (var i = 0; i < howto.n; i++) {
    var off = i - howto.pos; if (Math.abs(off) > 1.2) continue;
    ctx.save(); ctx.globalAlpha = a * clamp(1 - Math.abs(off) * 1.1, 0, 1); ctx.translate(off * 480, 0);
    howPage(i); ctx.restore();
  }
  ctx.restore();
  // dots
  for (i = 0; i < howto.n; i++) {
    var on = 1 - clamp(Math.abs(i - howto.pos), 0, 1);
    ctx.fillStyle = 'rgba(255,' + Math.round(lerp(255, 80, on)) + ',' + Math.round(lerp(255, 80, on)) + ',' + (0.35 + 0.65 * on) + ')';
    rrect(ctx, 300 - howto.n * 13 + i * 26 + 6 - on * 6, 516, 14 + on * 12, 10, 5); ctx.fill();
  }
  howto.btnBack.draw(); howto.btnPrev.draw(); howto.btnNext.draw();
  howto.btnPlay.alpha = sstep(0.5, 0.0, Math.abs(howto.pos - (howto.n - 1)));
  howto.btnPlay.active = howto.page === howto.n - 1;
  howto.btnPlay.draw();

  scr(); ctx.globalAlpha = a * 0.5; txt(isTouch ? 'swipe for more' : '← → or A / D to flip pages  ·  Esc to go back', W / 2, Math.min(H - 14, UY + 600 * U - 8), 12, '#fff'); ctx.globalAlpha = 1;

/* =====================================================================
   PRESS / KEY ROUTING
   ===================================================================== */
function onPress(px, py, u) {
  if (scene === 'title') {
    if (fsHit(px, py)) { toggleFullscreen(); return; }
    if (st < 0.3) return;
    if (btnPlay.hit(u)) { btnPlay.press(); startIntro(); return; }
    if (btnHow.hit(u)) { btnHow.press(); setScene('howto'); howto.page = 0; howto.pos = 0; return; }
  } else if (scene === 'howto') {
    if (howto.btnBack.hit(u)) { setScene('title'); st = 0.3; return; }
    if (howto.btnPrev.hit(u)) { howto.go(-1); return; }
    if (howto.btnNext.hit(u)) { howto.go(1); return; }
    if (howto.btnPlay.hit(u)) { startIntro(); return; }
  } else if (scene === 'game') {
    if (game.paused) {
      if (btnResume.hit(u)) { btnResume.press(); resumeGame(); return; }
      if (btnMenuP.hit(u)) { toMenu(); return; }
      if (!isTouch) resumeGame();
      return;
    }
    if (pauseBtnHit(px, py)) { pauseGame(); return; }
    if (!locked) requestLock();
  } else if (scene === 'complete') {
    completeContinue();
  } else if (scene === 'dead') {
    if (st < 3.7) return;
    if (btnRetry.hit(u)) { btnRetry.press(); retry(); return; }
    if (btnMenuD.hit(u)) { toMenu(); return; }
  }
}
function onKey(code) {
  if (scene === 'title' && st > 0.3 && (code === 'Enter' || code === 'Space')) startIntro();
  else if (scene === 'howto') {
    if (code === 'ArrowRight' || code === 'KeyD') howto.go(1);
    else if (code === 'ArrowLeft' || code === 'KeyA') howto.go(-1);
    else if (code === 'Space' || code === 'Enter') { if (howto.page === howto.n - 1) startIntro(); else howto.go(1); }
    else if (code === 'Escape') { setScene('title'); st = 0.3; }
  } else if (scene === 'complete' && (code === 'Space' || code === 'Enter')) completeContinue();
  else if (scene === 'dead' && st > 3.7) {
    if (code === 'Space' || code === 'Enter') retry(); else if (code === 'Escape') toMenu();
  } else if (scene === 'game') {
    if (code === 'KeyP' || (code === 'Escape' && (isTouch || lockFailed || !locked))) { if (game.paused) resumeGame(); else pauseGame(); }
  }
}

/* =====================================================================
   MAIN LOOP (delta time)
   ===================================================================== */
var last = performance.now();
function frame(now) {
  var dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  T += dt; st += dt;
  try {
    if (scene === 'title') { updateTitle(dt); drawTitle(); }
    else if (scene === 'intro') drawIntro(dt);
    else if (scene === 'howto') { updateHowto(dt); drawHowto(); }
    else if (scene === 'game') { updateGame(dt); if (scene === 'game') drawGame(); }
    else if (scene === 'complete') drawComplete(dt);
    else if (scene === 'dead') drawDeath(dt);
    if (scene !== 'dead' || st > 1.6) adaptQuality(dt);
    if (fadeBlack > 0) { fadeBlack = Math.max(0, fadeBlack - dt / 1.2); drawWhite(fadeBlack, '#000'); }
  } catch (err) { if (window.console) console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks (harmless in normal play)
window.__mm2 = {
  get scene() { return scene; }, get level() { return level; }, get world() { return world; }, P: P, game: game,
  goto: function (s) {
    if (s === 'game') { loadLevel(1); setScene('game'); game.wake = 99; game.freeze = 0; }
    else if (s === 'wake') { startGame(); st = 0; }
    else if (s === 'complete') { if (!world) loadLevel(1); setScene('game'); startComplete(); }
    else if (s === 'dead') { if (!world) loadLevel(1); startDeath(); }
    else if (s === 'howto') { setScene('howto'); }
    else if (s === 'intro') { startIntro(); }
    else setScene(s);
  },
  skip: function (sec) { st += sec; if (scene === 'complete') comp.t += sec; if (scene === 'game') game.wake += sec; },
  page: function (p) { howto.page = p; howto.pos = p; },
  setTouch: function (v) { isTouch = v; },
  ms: function () { return renderMs; }, q: function () { return [quality, RW, RH]; }
};
})();
